fidelity:
  divergences: >-
    The Challenge states the SDE solution via concrete left-sum convergence
    in probability (IsStrongLinearSolution). This and the library's
    IsStrongLinearSDESolution are distinct structures with the same five
    conditions; the Solution converts between them by passing each field
    explicitly. The Challenge uses
    Mathlib's gaussianReal CDF for the Black-Scholes expression rather
    than the standard normal CDF symbol Phi. The formalization works in
    the universe-polymorphic setting with Type u sample spaces. The
    Brownian driver is assumed continuous only almost surely
    (IsBrownianReal); the proof passes through a version with every path
    continuous and transports the conclusion back. Black-Scholes uses the
    constant-drift instance of the proved predictable Girsanov theorem.
    Constructing its input data for arbitrary integrands remains deferred
    and is not needed for the submitted statement.

review:
  status: "agent-reviewed"
  reviewers:
    - "Ezzeri Esa"
    - "Claude Fable 5.1 (Anthropic)"
    - "OpenAI Codex"
  notes: >-
    The Challenge was read by the author and checked field by field against
    the library statement. An agent review on 2026-09-21 compared the
    repository against the sibling submissions and Palomar's policy, ran the
    pinned Comparator, and produced the checklist addressed in this release.
    Agents performed the upgrade on 2026-09-27 and the module-system port on
    2026-09-29, each with local checks; these are not a Palomar review.
    The proof library has not been examined in depth by human experts.

alignment:
  namespace: "PalomarBlackScholes"
  statements:
    - source: "Black-Scholes pricing theorem"
      lean: "PalomarBlackScholes.black_scholes"
      module: "BlackScholesSolution"
      status: "proved"
      note: >-
        Proves equivalence and probability of the risk-neutral measure,
        Brownianity of the shifted driver by the predictable Girsanov
        theorem, the martingale property of the discounted stopped asset,
        payoff integrability, and the closed-form call valuation for any
        strong GBM SDE solution.

