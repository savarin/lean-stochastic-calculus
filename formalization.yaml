# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Black-Scholes pricing via Girsanov change of measure"
  description: >-
    Formal proof of the time-zero Black-Scholes formula for a European call
    on any strong solution of the geometric Brownian motion SDE, with positive
    initial price, strike, volatility and maturity, and constant drift and
    interest rate. The change of measure uses the constant-drift
    case of the general predictable (dynamic) Girsanov theorem.
    The discounted stopped asset is a martingale
    under one fixed terminal measure, and the call-payoff expectation
    equals the closed-form Black-Scholes expression.
  authors:
    - "Ezzeri Esa"
  responsible_maintainers:
    - "Ezzeri Esa"
  license: "Apache-2.0"

classification:
  arxiv: ["math.PR", "q-fin.MF"]
  msc2020: ["91G20", "60H10", "60H05"]

sources:
  - title: "The Pricing of Options and Corporate Liabilities"
    authors:
      - "Fischer Black"
      - "Myron Scholes"
    type: "paper"
    id: "doi:10.1086/260062"
    location: "Page 644, equation (13), the European call-pricing formula"
    relationship: "independently-proves"
    author_endorsement: "not-contacted"
    note: >-
      The closed-form call price that the compared theorem reproduces. The
      paper derives it from the replicating-portfolio partial differential
      equation; the formalization instead prices under the risk-neutral
      measure obtained by Girsanov's theorem. This is a source-based
      formalization of a known result, not the first presentation of a
      theorem or a claim of a new mathematical proof method. The compared
      theorem establishes the discounted-expectation formula and its
      measure-change prerequisites; it does not formalize the paper's
      replication argument or its corporate-liability applications.
  - title: "Brownian Motion and Stochastic Calculus"
    authors:
      - "Ioannis Karatzas"
      - "Steven E. Shreve"
    type: "book"
    id: "doi:10.1007/978-1-4612-0949-2"
    location: "Section 3.5, the Girsanov theorem and Novikov's condition"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Background for the standard change-of-measure route: the
      Doleans-Dade exponential, Novikov's condition and Girsanov's theorem.
      The Lean development implements that route in its own martingale
      and quadratic-variation framework; it is not a line-by-line
      translation of this book. BLUEPRINT.md maps the actual proof route
      to the code.

status:
  scope: >-
    The formalization covers the finite-horizon European call on a single
    asset driven by scalar Brownian motion. It proves that the explicitly
    defined risk-neutral measure is a probability measure equivalent to the
    original measure (the two give probability zero to the same events),
    Brownianity of the shifted driver, the martingale property of the
    discounted stopped asset, integrability of the call payoff, and equality
    of the discounted expectation at time zero with the Black-Scholes closed
    form.
    Initial price, strike, volatility and maturity are strictly positive;
    drift and interest rate are arbitrary real constants. The driver is
    Brownian with strongly measurable values at each time. The solution is
    adapted to its natural filtration, has continuous paths and the stated
    initial value almost surely, has integrable drift on each finite interval
    along almost every path, and satisfies the left-sum convergence condition.
    The statement does not include trading-strategy replication or a
    conditional price process at later times.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "PalomarBlackScholes.black_scholes"
      file: "BlackScholesSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-black-scholes.json"

