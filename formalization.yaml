version: "v0.4"

project:
  name: "Black-Scholes pricing via Girsanov change of measure"
  description: >-
    Formal proof that every strong solution of the geometric Brownian motion
    SDE is priced by the Black-Scholes formula under the Girsanov
    risk-neutral measure. The discounted stopped asset is a martingale
    under one fixed terminal measure, and the call-payoff expectation
    equals the closed-form Black-Scholes expression.
  authors:
    - "Ezzeri Esa"
  responsible_maintainers:
    - "Ezzeri Esa"
  license: "Apache-2.0"

classification:
  arxiv: ["math.PR", "q-fin.MF"]
  msc2020: ["91G20", "60H10", "60H05"]

sources:
  - title: "The Pricing of Options and Corporate Liabilities"
    authors:
      - "Fischer Black"
      - "Myron Scholes"
    type: "paper"
    id: "doi:10.1086/260062"
    location: "Theorem statement and pricing formula"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      TODO: fill in source details.

status:
  scope: >-
    The formalization covers the finite-horizon European call on a single
    asset driven by scalar Brownian motion. It proves existence and mutual
    absolute continuity of the risk-neutral measure, Brownianity of the
    shifted driver, the martingale property of the discounted stopped
    asset, integrability of the call payoff, and equality of the
    discounted expectation with the Black-Scholes closed form.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "PalomarBlackScholes.black_scholes"
      file: "BlackScholesSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-black-scholes.json"

