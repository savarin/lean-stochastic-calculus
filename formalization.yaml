fidelity:
  divergences: >-
    The Challenge states the SDE solution via concrete left-sum convergence
    in probability (IsStrongLinearSolution), which is definitionally equal
    to the library's IsStrongLinearSDESolution. The Challenge uses
    Mathlib's gaussianReal CDF for the Black-Scholes expression rather
    than the standard normal CDF symbol Phi. The formalization works in
    the universe-polymorphic setting with Type u sample spaces.

