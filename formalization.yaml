        integral and process, quadratic variation, the Ito formula and its
        general form, the Doleans-Dade exponential, Novikov's condition,
        early Girsanov and Gaussian-evaluation components, and the Girsanov
        theorem over five sessions. Session records name GPT-5.6 Sol for
        most runs. The quadratic-variation and Novikov-condition runs have no
        model record, and the Girsanov-theorem run's records disagree: its
        session logs name GPT-5.6 Sol and its telemetry names GPT-6 Astra.
        Lean elaboration and Lake builds were the only oracle.
      prompting_notes: >-
        Each run was launched by the formalization pipeline for one
        component; its prompts are not reproduced here.
    - method: "agent"
      models: ["GPT-6 Astra (OpenAI)"]
      framework: "Codex"
      tool_setup: >-
        On 2026-09-07 PDT, in the lean-pipeline/black-scholes-sde workspace,
        an agent finished the strong-GBM uniqueness component, then
        combined completed Girsanov, strong-GBM uniqueness and
        Gaussian-evaluation workspaces, proved measure identification,
        filtration invariance, discounted martingality for arbitrary strong
