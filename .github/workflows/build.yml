name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          build-args: "StochasticCalculus BlackScholesSolution --iofail"
      - name: Build the Challenge (its deliberate sorry is a warning)
        run: lake build BlackScholesChallenge
      - name: Check Palomar package boundary
        run: python3 scripts/check_boundary.py
      - name: Check the dynamic Girsanov proof route
        run: lake env lean scripts/check_girsanov_route.lean
      - name: Get the pinned Palomar metadata validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: 65f0154ed776cd26c224254aa57b379137f28b0d
          path: .lake/palomar-submission
          persist-credentials: false
      - name: Check metadata and packaging
        run: |
          python3 -m venv .lake/checks-venv
          .lake/checks-venv/bin/python -m pip install -r scripts/requirements-checks.txt
          .lake/checks-venv/bin/python scripts/check_metadata.py
