name = "lean-stochastic-calculus"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["StochasticCalculus"]

[leanOptions]
weak.linter.mathlibStandardSet = true
autoImplicit = false
relaxedAutoImplicit = false
linter.unusedVariables = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[[lean_lib]]
name = "StochasticCalculus"
